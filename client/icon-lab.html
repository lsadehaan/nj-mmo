<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icon Lab</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #1a1420;
        color: #e8e0f0;
        font: 14px/1.4 system-ui, sans-serif;
      }
      #sheet {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px;
      }
      .icon-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 80px;
      }
      .icon-cell img {
        width: 64px;
        height: 64px;
        image-rendering: pixelated;
      }
      .icon-cell span {
        font-size: 11px;
        text-align: center;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="sheet"></div>
    <script type="module" src="/src/icon-lab.ts"></script>
  </body>
</html>
